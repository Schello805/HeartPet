name: HeartPet Verify

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-24.04
    timeout-minutes: 15
    steps:
      - name: Repository auschecken
        uses: actions/checkout@v5

      - name: Node.js einrichten
        uses: actions/setup-node@v5
        with:
          node-version: 22
          cache: npm

      - name: Abhängigkeiten installieren
        run: npm ci

      - name: Produktionsabhängigkeiten auf Schwachstellen prüfen
        run: npm run audit:production

      - name: Chromium installieren
        run: npx playwright install chromium

      - name: HeartPet vollständig prüfen
        run: npm run verify
